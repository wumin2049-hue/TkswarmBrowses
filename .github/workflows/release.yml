name: Release 第一页自研浏览器

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  # Electron / electron-builder 二进制走国内镜像，避免 GitHub CDN 504
  ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
  ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
  NPM_CONFIG_INCLUDE: dev
  npm_config_registry: https://registry.npmjs.org/

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "==> npm ci attempt $i"
            if npm ci; then
              break
            fi
            echo "npm ci failed (attempt $i), cleaning and retrying..."
            rm -rf node_modules
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((i * 20))
          done
          test -d node_modules/electron
          test -d node_modules/electron-builder
          node -e "require('electron'); console.log('electron package ok')"
          npx electron-builder --version

      - name: Build Windows (NSIS + portable)
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('fs').accessSync('build/icon.ico'); require('fs').accessSync('build/icon.png'); console.log('icons ok')"
          npm run icons
          npx electron-builder --win --publish never

      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          Write-Host "=== dist/ ==="
          Get-ChildItem dist -File | Format-Table Name, Length
          $setup = Get-ChildItem dist -Filter "*-setup.exe" -ErrorAction SilentlyContinue
          $portable = Get-ChildItem dist -Filter "*-portable.exe" -ErrorAction SilentlyContinue
          if (-not $setup) { throw "NSIS setup EXE missing" }
          if (-not $portable) { throw "Portable EXE missing — check package.json win.target includes portable" }

      # 手动跑：可选上传 Artifact（配额满不阻断）
      - name: Upload Windows artifact (CI only)
        if: github.ref_type != 'tag'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-Windows
          retention-days: 3
          if-no-files-found: warn
          path: |
            dist/*-setup.exe
            dist/*-portable.exe

      # tag 发版：直传 GitHub Release（不占 Artifact 配额）
      - name: Attach Windows to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable.exe
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          body: |
            ## 下载说明

            ### Windows
            - **TkSwarmBrowser-*-win-portable.exe** — 绿色免安装便携版（推荐），数据在 exe 同级 data/
            - **TkSwarmBrowser-*-win-x64-setup.exe** — NSIS 安装版

            ### macOS
            - **TkSwarmBrowser-*-mac-arm64.dmg** — Apple Silicon (M 系列)
            - **TkSwarmBrowser-*-mac-x64.dmg** — Intel Mac
            - 对应 `.zip` 为解压即用

            本地 API 默认 http://127.0.0.1:54345，与 tkswarm-node 比特接口兼容。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mac:
    # Windows 是主测试平台：等 build-win 完成后 mac 才开始，Windows 产物先出。
    # 若 build-win 失败，mac 会被跳过（省 macOS 分钟数）；需要强制打 mac 可手动 Re-run。
    needs: build-win
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies (retry)
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "==> npm ci attempt $i"
            if npm ci; then
              break
            fi
            echo "npm ci failed (attempt $i), cleaning and retrying..."
            rm -rf node_modules
            if [ "$i" -eq 3 ]; then
              echo "npm ci failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((i * 20))
          done
          test -d node_modules/electron
          test -d node_modules/electron-builder
          node -e "require('electron'); console.log('electron package ok')"
          npx electron-builder --version

      - name: Build macOS (DMG + ZIP, x64 + arm64)
        shell: bash
        run: |
          set -euo pipefail
          node -e "require('fs').accessSync('build/icon.ico'); require('fs').accessSync('build/icon.png'); console.log('icons ok')"
          npm run icons
          npx electron-builder --mac --publish never

      - name: Verify macOS artifacts
        run: |
          echo "=== dist/ ==="
          ls -la dist/
          test -n "$(ls dist/*.dmg 2>/dev/null)" || (echo "DMG missing" && exit 1)
          test -n "$(ls dist/*.zip 2>/dev/null)" || (echo "ZIP missing" && exit 1)

      - name: Upload macOS artifact (CI only)
        if: github.ref_type != 'tag'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TkSwarmBrowser-macOS
          retention-days: 3
          if-no-files-found: warn
          path: |
            dist/*.dmg
            dist/*.zip

      - name: Attach macOS to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
